<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reset Password — Blockout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="card auth-card">
      <a href="index.html" class="logo-link">
        <h1><img src="icon.png" alt="" class="logo-icon" /><span class="gradient-text">Blockout</span></h1>
      </a>

      <p class="card-subtitle">Choose a new password for your account.</p>
      <input type="password" id="newPassword" placeholder="New password" />
      <div id="error" class="field-error"></div>
      <button id="submit" class="btn-primary" style="width: 100%">Update Password</button>
    </div>

    <script type="module" src="reset-password.js"></script>
  </body>
</html>
