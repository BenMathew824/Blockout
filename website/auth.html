<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sign In — Blockout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="card auth-card">
      <a href="index.html" class="logo-link">
        <h1><img src="icon.png" alt="" class="logo-icon" /><span class="gradient-text">Blockout</span></h1>
      </a>

      <div class="mode-tabs">
        <button class="mode-tab selected" data-mode="signin">Sign In</button>
        <button class="mode-tab" data-mode="signup">Sign Up</button>
      </div>

      <div id="credentialsForm">
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <div class="auth-links" id="forgotPasswordRow">
          <button type="button" id="forgotPasswordLink" class="link-btn">Forgot password?</button>
        </div>
        <div id="error" class="field-error"></div>
        <button id="submit" class="btn-primary" style="width: 100%">Sign In</button>
      </div>

      <div id="forgotForm" hidden>
        <p class="card-subtitle">Enter your email and we'll send you a link to reset your password.</p>
        <input type="email" id="forgotEmail" placeholder="Email" />
        <div id="forgotError" class="field-error"></div>
        <div id="forgotSuccess" class="field-hint"></div>
        <button id="forgotSubmit" class="btn-primary" style="width: 100%">Send Reset Link</button>
        <button type="button" id="backToSignIn" class="link-btn" style="display: block; margin: 12px auto 0;">← Back to Sign In</button>
      </div>
    </div>

    <script type="module" src="auth.js"></script>
  </body>
</html>
