<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Blocked — Blockout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }

      :root {
        --hearth: #241a14;
        --hearth-2: #33241a;
        --ember: #ff9d4d;
        --ember-hot: #ffd166;
        --ember-deep: #b5651d;
        --wax: #f4e9d8;
        --smoke: #a5978a;
        --line: rgba(244, 233, 216, 0.14);
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

      body {
        font-family: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--wax);
        background: var(--hearth);
        overflow: hidden;
        position: relative;
      }

      .card {
        position: relative;
        z-index: 1;
        width: 380px;
        max-width: 90vw;
        padding: 40px 32px;
        border-radius: 18px;
        background: var(--hearth-2);
        border: 1px solid rgba(255, 157, 77, 0.18);
        box-shadow: 0 24px 60px rgba(10, 6, 3, 0.5);
        text-align: center;
      }

      .lock-ring {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
      }
      .lock-ring > svg.ring-svg { transform: rotate(-90deg); }
      .ring-bg {
        fill: none;
        stroke: var(--line);
        stroke-width: 6;
      }
      .ring-progress {
        fill: none;
        stroke: url(#ringGradient);
        stroke-width: 6;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s linear;
      }
      .companion-icon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #blockedFlame {
        filter: drop-shadow(0 0 8px rgba(255, 157, 77, 0.55));
        animation: wickFlicker 3.2s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      @keyframes wickFlicker {
        0%, 100% { transform: scaleX(1) skewX(0deg); }
        22% { transform: scaleX(0.96) skewX(-1.2deg); }
        48% { transform: scaleX(1.04) skewX(1deg); }
        75% { transform: scaleX(0.98) skewX(-0.6deg); }
      }

      .wordmark {
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 30px;
        color: var(--ember-hot);
        margin: 0 0 12px;
      }

      .site-pill {
        display: inline-block;
        background: var(--hearth);
        border: 1px solid var(--line);
        color: var(--smoke);
        font-family: "Space Mono", monospace;
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
        word-break: break-all;
      }

      p.subtitle {
        color: var(--smoke);
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 14px;
      }

      #reasonBox {
        display: none;
        background: var(--hearth);
        border: 1px solid var(--line);
        color: var(--smoke);
        font-size: 13px;
        line-height: 1.5;
        padding: 10px 14px;
        border-radius: 10px;
        margin: 0 0 20px;
        text-align: left;
      }
      #reasonBox .icon { flex-shrink: 0; margin-top: 1px; color: var(--ember); }
      #reasonBox .reason-row { display: flex; gap: 7px; align-items: flex-start; }

      #topic {
        display: none;
        background: var(--hearth);
        border: 1px solid var(--line);
        padding: 10px 16px;
        border-radius: 10px;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--smoke);
      }
      #topic strong {
        color: var(--wax);
        font-family: "Nunito", sans-serif;
        font-style: italic;
        font-weight: 700;
      }

      #countdownBox {
        display: none;
        margin-bottom: 24px;
      }
      .countdown-label {
        font-family: "Space Mono", monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--smoke);
        margin-bottom: 4px;
      }
      #countdown {
        font-family: "Space Mono", monospace;
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--wax);
      }

      button {
        width: 100%;
        padding: 13px 20px;
        background: linear-gradient(135deg, var(--ember), var(--ember-hot));
        color: var(--hearth);
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 800;
        font-family: "Nunito", inherit;
        cursor: pointer;
        box-shadow: 0 3px 0 var(--ember-deep);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      button:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ember-deep); }
      button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ember-deep); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lock-ring">
        <svg class="ring-svg" width="120" height="120">
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff9d4d" />
              <stop offset="100%" stop-color="#ffd166" />
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="52" />
        </svg>
        <div class="companion-icon">
          <svg viewBox="0 0 56 76" width="48" height="65" aria-hidden="true">
            <defs>
              <linearGradient id="waxGrad2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f4e9d8" />
                <stop offset="100%" stop-color="#e3d3ba" />
              </linearGradient>
              <linearGradient id="flameGrad2" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#ff9d4d" />
                <stop offset="100%" stop-color="#ffd166" />
              </linearGradient>
            </defs>
            <ellipse cx="28" cy="68" rx="16" ry="5" fill="#e3d3ba" opacity="0.5" />
            <rect x="18" y="20" width="20" height="44" rx="3" fill="url(#waxGrad2)" />
            <rect x="27" y="15" width="2" height="5" fill="#3a2a1c" />
            <svg id="blockedFlame" x="18" y="-7" width="20" height="26" viewBox="0 0 48 64">
              <path d="M24 4C15 18 9 30 9 40C9 52 15.5 60 24 60C32.5 60 39 52 39 40C39 30 33 18 24 4Z" fill="url(#flameGrad2)" />
              <path d="M24 24C19 32 16 38 16 44C16 51 19.5 56 24 56C28.5 56 32 51 32 44C32 38 29 32 24 24Z" fill="#ffd166" opacity="0.85" />
            </svg>
          </svg>
        </div>
      </div>

      <h1 class="wordmark">The flame stays lit</h1>
      <div class="site-pill" id="site"></div>
      <p class="subtitle">This page was flagged as off-topic while Focus Mode is on.</p>

      <div id="reasonBox">
        <div class="reason-row">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
          <span id="reasonText"></span>
        </div>
      </div>

      <div id="topic"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M12 6c-2-1.5-5-1.5-8-1v13c3-.5 6-.5 8 1c2-1.5 5-1.5 8-1V5c-3-.5-6-.5-8 1Z"/><path d="M12 6v13"/></svg>You said you're focusing on: <strong id="topicText"></strong></div>

      <div id="countdownBox">
        <div class="countdown-label">Session ends in</div>
        <div id="countdown">--:--</div>
      </div>

      <button id="back">← Return</button>
    </div>

    <script src="blocked.js"></script>
  </body>
</html>
